        <path d="M57 39.5 L74 49 L57 58.5 Z" fill="#8A3CF0" stroke="#8A3CF0" stroke-width="4" stroke-linejoin="round"/>
        <!-- timeline with trimmed selection -->
        <rect x="18" y="88" width="92" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.3"/>
        <rect x="40" y="88" width="48" height="12" fill="#FFFFFF" fill-opacity="0.9"/>
        <rect x="34" y="82" width="8" height="24" rx="4" fill="#FFFFFF"/>
        <rect x="86" y="82" width="8" height="24" rx="4" fill="#FFFFFF"/>
    </g>
</svg>
